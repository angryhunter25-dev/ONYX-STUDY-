name: Build User APK
on: workflow_dispatch

permissions:
  contents: write   # needed to publish the APK as a GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Same signing key on every build, otherwise Android refuses to install an
      # update over the old app ("App not installed"). See README_SETUP.md.
      - name: Restore signing key
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > ~/.android/debug.keystore
            echo "Using permanent signing key"
          else
            echo "::warning::KEYSTORE_BASE64 secret missing - APK gets a random key, so users cannot update over an old install"
          fi

      - name: Build number
        run: echo "BN=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Generate Android project
        working-directory: user_app
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml && cp -r lib /tmp/lib
          flutter create --platforms=android --org com.onyx --project-name user_app .
          cp /tmp/pubspec.yaml pubspec.yaml && rm -rf lib test && cp -r /tmp/lib lib

          # --- Android settings ---
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' android/app/build.gradle || true
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle.kts || true
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>\n    <uses-permission android:name="android.permission.BLUETOOTH"/>\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>\n    <application android:usesCleartextTraffic="true"#' $M
          sed -i 's#android:label="[^"]*"#android:label="ONYX"#' $M

      # Old plugins (e.g. agora_rtc_engine) compile against Android 31 but need 34+.
      # This Gradle init script raises compileSdk to 36 for every plugin module below 36.
      - name: Fix old plugins compileSdk
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/fix-sdk.gradle <<'GRADLE'
          allprojects {
              afterEvaluate { p ->
                  if (p.name != 'app' && p.hasProperty('android')) {
                      try {
                          def cur = p.android.compileSdkVersion?.toString() ?: ''
                          def digits = cur.replaceAll('[^0-9]', '')
                          if (digits != '' && digits.toInteger() < 36) {
                              p.android { compileSdkVersion 36 }
                          }
                      } catch (Throwable t) {
                          println "compileSdk patch skipped for ${p.name}: ${t.message}"
                      }
                  }
              }
          }
          GRADLE

      - name: Build
        working-directory: user_app
        run: |
          flutter pub get
          if [ -f assets/icon.png ]; then dart run flutter_launcher_icons || true; fi
          flutter build apk --release --build-number=$BN --build-name=1.0.$BN

      - name: Publish APK (GitHub Release)
        working-directory: user_app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk onyx-user.apk
          gh release create "v$BN" onyx-user.apk --repo "$GITHUB_REPOSITORY" \
            --title "ONYX build $BN" --notes "ONYX user app build $BN"
          {
            echo "## Update ready"
            echo ""
            echo "Owner app > (top bar) App update me ye daalo:"
            echo ""
            echo "- **Version code:** \`$BN\`"
            echo "- **APK link:** https://github.com/$GITHUB_REPOSITORY/releases/download/v$BN/onyx-user.apk"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: onyx-user-apk
          path: user_app/build/app/outputs/flutter-apk/app-release.apk
